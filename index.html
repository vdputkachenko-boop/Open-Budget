<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart QR City</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.header{
    padding:16px;
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
}

.card{
    max-width:520px;
    margin:12px auto;
    background:rgba(255,255,255,0.06);
    padding:12px;
    border-radius:14px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:15px;
}

#map{
    height:320px;
    border-radius:12px;
}

.result{
    padding:10px;
    background:rgba(255,255,255,0.07);
    border-radius:10px;
    margin-top:10px;
}

.item{
    padding:8px;
    margin-top:6px;
    background:rgba(255,255,255,0.05);
    border-radius:10px;
    cursor:pointer;
}

#scanner{display:none;margin-top:10px;}
</style>
</head>

<body>

<div class="header">
    <h2>📲 Smart QR City</h2>
    <p>Скануй → дивись об’єкт → карта міста</p>
</div>

<!-- SCANNER -->
<div class="card">
    <button onclick="toggleScanner()">📷 Сканувати QR</button>
    <div id="scanner"></div>
</div>

<!-- RESULT -->
<div class="card">
    <div class="result" id="result">Наведіть QR або натисніть об’єкт</div>
</div>

<!-- MAP -->
<div class="card">
    <div id="map"></div>
</div>

<!-- LIST -->
<div class="card">
    <h3>📍 Об’єкти</h3>
    <div id="list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// 🧠 ДАНІ (без бюджету — тільки об’єкти)
const data = {
    bench_01:{
        name:"🪑 Лавка",
        info:"Парк / зона відпочинку",
        coords:[49.2331,28.4682]
    },
    trash_01:{
        name:"🗑️ Смітник",
        info:"Комунальна інфраструктура",
        coords:[49.2320,28.4650]
    },
    stop_01:{
        name:"🚌 Зупинка",
        info:"Громадський транспорт",
        coords:[49.2340,28.4700]
    },
    light_01:{
        name:"💡 Освітлення",
        info:"Вуличне освітлення",
        coords:[49.2350,28.4660]
    },
    park_01:{
        name:"🌳 Парк зона",
        info:"Зелена зона міста",
        coords:[49.2310,28.4690]
    }
};

// 📍 SHOW OBJECT
function show(id){
    let o=data[id];
    document.getElementById("result").innerHTML=`
        <b>${o.name}</b><br>
        📍 ${o.info}
    `;
}

// 🗺️ MAP (ВІННИЦЯ)
let map=L.map('map').setView([49.2331,28.4682],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:''
}).addTo(map);

// 📍 MANY MARKERS
for(let id in data){
    let m=data[id];

    let marker=L.marker(m.coords).addTo(map);
    marker.bindPopup(m.name);

    marker.on("click",()=>show(id));
}

// 📍 LIST
let list=document.getElementById("list");

for(let id in data){
    let div=document.createElement("div");
    div.className="item";
    div.innerText=data[id].name;
    div.onclick=()=>show(id);
    list.appendChild(div);
}

// 📷 QR SCANNER (BUTTON)
let scanner;
let active=false;

function toggleScanner(){
    let box=document.getElementById("scanner");

    if(active){
        scanner.stop();
        box.style.display="none";
        active=false;
        return;
    }

    box.style.display="block";

    scanner=new Html5Qrcode("scanner");

    scanner.start(
        { facingMode:"environment" },
        { fps:10, qrbox:250 },
        (text)=>{
            show(text);
            toggleScanner();
        }
    );

    active=true;
}

</script>

</body>
</html>
