<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenBudget PRO | Райгородська громада</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, Arial;
    background:#0b1220;
    color:white;
}

/* HEADER */
.header{
    padding:26px 18px;
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
}

.header h2{
    margin:0;
    font-size:22px;
}

.header p{
    margin-top:6px;
    opacity:0.85;
    font-size:13px;
}

/* CARD */
.card{
    max-width:450px;
    margin:16px auto;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    padding:16px;
    border-radius:18px;
    backdrop-filter: blur(10px);
}

/* TEXT */
.title{font-size:20px;font-weight:600;}
.price{font-size:26px;color:#22c55e;margin:10px 0;font-weight:700;}
.badge{display:inline-block;padding:5px 10px;background:#2563eb;border-radius:8px;font-size:12px;}
.info{margin-top:10px;color:#cbd5e1;font-size:14px;line-height:1.4;}

/* MAP */
#map{
    height:200px;
    border-radius:12px;
    margin-top:10px;
}

/* LIST */
.item{
    padding:10px;
    margin-top:8px;
    border-radius:10px;
    background:rgba(255,255,255,0.05);
    cursor:pointer;
}

/* QR */
input{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:none;
    margin-top:10px;
}

button{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    cursor:pointer;
}

/* FOOTER */
.footer{
    text-align:center;
    font-size:12px;
    opacity:0.5;
    margin:20px;
}
</style>
</head>

<body>

<div class="header">
    <h2>🏛️ OpenBudget PRO</h2>
    <p>Райгородська громада — прозора інфраструктура</p>
</div>

<!-- 📍 ОБ’ЄКТ -->
<div class="card">
    <div class="title" id="title">Завантаження...</div>
    <div class="badge" id="type"></div>
    <div class="price" id="price"></div>
    <div class="info" id="info"></div>

    <div id="map"></div>
</div>

<!-- 📊 СПИСОК -->
<div class="card">
    <h3>📍 Всі об’єкти громади</h3>
    <div id="list"></div>
</div>
