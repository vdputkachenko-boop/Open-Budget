<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenBudget Smart QR</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.header{
    padding:18px;
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
}

.card{
    max-width:500px;
    margin:15px auto;
    background:rgba(255,255,255,0.06);
    padding:15px;
    border-radius:12px;
}

#map{
    height:250px;
    border-radius:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
}

#reader{
    width:100%;
}

.item{
    padding:10px;
    margin-top:8px;
    background:rgba(255,255,255,0.05);
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
    <h2>🏛️ OpenBudget SMART QR</h2>
    <p>QR + Карта + Прозорість бюджету</p>
</div>

<!-- 📷 QR SCANNER -->
<div class="card">
    <h3>📷 Сканер QR</h3>
    <div id="reader"></div>
</div>

<!-- 📍 INFO -->
<div class="card">
    <h3 id="title">Наведіть QR</h3>
    <div id="info"></div>
    <div id="price"></div>
</div>

<!-- 🗺️ MAP -->
<div class="card">
    <h3>🗺️ Карта громади</h3>
    <div id="map"></div>
</div>

<!-- 📍 LIST -->
<div class="card">
    <h3>📍 Об’єкти</h3>
    <div id="list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// 🧠 ДАНІ (багато точок)
const data = {
    bench_01:{
        title:"🪑 Лавка",
        price:9000,
        coords:[48.95,28.65],
        info:"Благоустрій громади"
    },
    bench_02:{
        title:"🪑 Лавка парк",
        price:9500,
        coords:[48.951,28.651],
        info:"Парк зона"
    },
    trash_01:{
        title:"🗑️ Смітник",
        price:5400,
        coords:[48.96,28.66],
        info:"Комунальна інфраструктура"
    },
    stop_01:{
        title:"🚌 Зупинка",
        price:85000,
        coords:[48.94,28.64],
        info:"Транспортна зупинка"
    },
    stop_02:{
        title:"🚌 Зупинка центр",
        price:88000,
        coords:[48.941,28.642],
        info:"Центральна зупинка"
    }
};

// 📍 MAP (БАГАТО МАРКЕРІВ)
let map = L.map('map').setView([48.95,28.65], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:''
}).addTo(map);

// додати всі точки
for(let id in data){
    let obj = data[id];

    let marker = L.marker(obj.coords).addTo(map);

    marker.bindPopup(obj.title);

    marker.on('click',()=>{
        showObject(id);
    });
}

// 📍 LIST
let list=document.getElementById("list");

for(let id in data){
    let div=document.createElement("div");
    div.className="item";
    div.innerText=data[id].title;
    div.onclick=()=>showObject(id);
    list.appendChild(div);
}

// 📲 SHOW OBJECT
function showObject(id){
    let obj=data[id];
    document.getElementById("title").innerText=obj.title;
    document.getElementById("info").innerText=obj.info;
    document.getElementById("price").innerText="💰 "+obj.price+" грн";
}

// 📷 QR SCANNER
function startScanner(){
    let scanner = new Html5QrcodeScanner("reader",{fps:10,qrbox:250});

    scanner.render((decodedText)=>{
        // QR = id
        showObject(decodedText);
    });
}

startScanner();

</script>

</body>
</html>
