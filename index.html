<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart QR City</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.header{
    padding:16px;
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
}

.card{
    max-width:520px;
    margin:12px auto;
    background:rgba(255,255,255,0.06);
    border-radius:14px;
    padding:14px;
    border:1px solid rgba(255,255,255,0.08);
}

/* HOME INFO */
.home{
    font-size:14px;
    opacity:0.9;
    line-height:1.5;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:15px;
}

/* MAP */
#map{
    height:320px;
    border-radius:12px;
}

/* SCANNER */
#scanner{
    display:none;
    margin-top:10px;
}

/* RESULT */
.result{
    padding:14px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
}

/* PRICE */
.price{
    font-size:26px;
    font-weight:bold;
    color:#22c55e;
    margin:10px 0;
}

/* BREAKDOWN */
.breakdown{
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    background:rgba(255,255,255,0.05);
    font-size:14px;
}
</style>
</head>

<body>

<div class="header">
    <h2>🏛️ Smart QR City</h2>
</div>

<!-- 🏠 ГОЛОВНЕ МЕНЮ -->
<div class="card">
    <div class="home">
        📲 Система прозорості міської інфраструктури<br><br>

        Наведіть QR на об’єкт (лавка, смітник, зупинка)  
        або виберіть точку на карті.<br><br>

        💡 Ви одразу бачите вартість об’єкта та структуру витрат.
    </div>
</div>

<!-- QR -->
<div class="card">
    <button onclick="toggleQR()">📷 Сканувати QR</button>
    <div id="scanner"></div>
</div>

<!-- RESULT -->
<div class="card">
    <div id="result" class="result">
        🔎 Очікування сканування або вибору об’єкта
    </div>
</div>

<!-- MAP -->
<div class="card">
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const data = {
    bench_01:{
        name:"🪑 Лавка",
        price:9000,
        breakdown:{
            "Матеріали":5000,
            "Робота":2500,
            "Монтаж":1500
        },
        coords:[49.2331,28.4682]
    },

    trash_01:{
        name:"🗑️ Смітник",
        price:5400,
        breakdown:{
            "Метал":3000,
            "Збірка":1500,
            "Доставка":900
        },
        coords:[49.2320,28.4660]
    },

    stop_01:{
        name:"🚌 Зупинка",
        price:85000,
        breakdown:{
            "Конструкція":50000,
            "Скло":20000,
            "Монтаж":15000
        },
        coords:[49.2340,28.4700]
    },

    light_01:{
        name:"💡 Освітлення",
        price:12000,
        breakdown:{
            "Ліхтар":7000,
            "Проводка":3000,
            "Монтаж":2000
        },
        coords:[49.2350,28.4660]
    }
};

// 📊 SHOW OBJECT
function show(id){
    let o=data[id];

    let html="";
    for(let k in o.breakdown){
        html += `<div>▪ ${k}: ${o.breakdown[k]} грн</div>`;
    }

    document.getElementById("result").innerHTML=`
        <h3>${o.name}</h3>

        <div class="price">
            ${o.price.toLocaleString()} грн
        </div>

        <div class="breakdown">
            ${html}
        </div>
    `;
}

// 🗺️ MAP
let map=L.map('map').setView([49.2331,28.4682],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:''
}).addTo(map);

// MARKERS
for(let id in data){
    let m=data[id];

    let marker=L.marker(m.coords).addTo(map);
    marker.bindPopup(m.name);
    marker.on("click",()=>show(id));
}

// 📷 QR
let scanner;
let active=false;

function toggleQR(){

    let box=document.getElementById("scanner");

    if(active){
        scanner.stop();
        box.style.display="none";
        active=false;
        return;
    }

    box.style.display="block";

    scanner=new Html5Qrcode("scanner");

    scanner.start(
        { facingMode:"environment" },
        { fps:10, qrbox:250 },
        (text)=>{
            if(data[text]){
                show(text);
            } else {
                document.getElementById("result").innerHTML=
                "❌ QR-код не знайдено";
            }
            toggleQR();
        }
    );

    active=true;
}

</script>

</body>
</html>
