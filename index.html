<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart QR City</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.header{
    padding:18px;
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
}

.card{
    max-width:520px;
    margin:12px auto;
    background:rgba(255,255,255,0.06);
    border-radius:14px;
    padding:14px;
    border:1px solid rgba(255,255,255,0.08);
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:15px;
}

#map{
    height:300px;
    border-radius:12px;
}

/* QR */
#scanner{
    display:none;
    margin-top:10px;
}

/* RESULT */
.result{
    padding:14px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    animation:fade 0.3s ease-in-out;
}

@keyframes fade{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

/* BADGE */
.badge{
    display:inline-block;
    padding:4px 8px;
    background:#2563eb;
    border-radius:8px;
    font-size:12px;
}

/* IMPACT */
.impact{
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    background:rgba(34,197,94,0.15);
    border:1px solid rgba(34,197,94,0.3);
}
</style>
</head>

<body>

<div class="header">
    <h2>🏛️ Smart QR City</h2>
    <p>Наведи камеру → отримай повну історію об’єкта</p>
</div>

<!-- QR -->
<div class="card">
    <button onclick="toggleQR()">📷 Сканувати QR</button>
    <div id="scanner"></div>
</div>

<!-- RESULT -->
<div class="card">
    <div id="result" class="result">
        🔎 Наведіть QR-код на об’єкт міської інфраструктури
    </div>
</div>

<!-- MAP -->
<div class="card">
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// 🧠 ОБ’ЄКТИ (без списків, тільки логіка)
const data = {
    bench_01:{
        name:"🪑 Лавка у парку",
        type:"Благоустрій",
        story:"Встановлена у 2024 році для покращення громадського простору.",
        impact:"Підвищує комфорт мешканців та соціальну взаємодію.",
        coords:[49.2331,28.4682]
    },

    trash_01:{
        name:"🗑️ Міський смітник",
        type:"Комунальна інфраструктура",
        story:"Елемент системи чистоти міста, регулярне оновлення кожні 5 років.",
        impact:"Зменшує забруднення міського простору.",
        coords:[49.2320,28.4660]
    },

    stop_01:{
        name:"🚌 Автобусна зупинка",
        type:"Транспорт",
        story:"Забезпечує доступ до громадського транспорту у густонаселеному районі.",
        impact:"Покращує мобільність мешканців міста.",
        coords:[49.2340,28.4700]
    },

    light_01:{
        name:"💡 Вуличне освітлення",
        type:"Інфраструктура",
        story:"Система нічного освітлення головних вулиць міста.",
        impact:"Підвищує безпеку в темний час доби.",
        coords:[49.2350,28.4660]
    }
};

// 📍 SHOW OBJECT (ГОЛОВНА ФІШКА)
function show(id){
    let o=data[id];

    document.getElementById("result").innerHTML=`
        <div class="badge">${o.type}</div>
        <h3>${o.name}</h3>

        📖 <b>Історія об’єкта:</b><br>
        ${o.story}<br><br>

        🌍 <b>Вплив на громаду:</b><br>
        ${o.impact}

        <div class="impact">
            💡 Цей об’єкт є частиною міської інфраструктури та відображає принцип прозорості міста.
        </div>
    `;
}

// 🗺️ MAP (Вінниця центр)
let map=L.map('map').setView([49.2331,28.4682],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:''
}).addTo(map);

// 📍 MARKERS
for(let id in data){
    let m=data[id];

    let marker=L.marker(m.coords).addTo(map);
    marker.bindPopup(m.name);
    marker.on("click",()=>show(id));
}

// 📷 QR SCANNER
let scanner;
let active=false;

function toggleQR(){

    let box=document.getElementById("scanner");

    if(active){
        scanner.stop();
        box.style.display="none";
        active=false;
        return;
    }

    box.style.display="block";

    scanner=new Html5Qrcode("scanner");

    scanner.start(
        { facingMode:"environment" },
        { fps:10, qrbox:250 },
        (text)=>{
            if(data[text]){
                show(text);
            } else {
                document.getElementById("result").innerHTML=
                "❌ QR-код не знайдено в системі";
            }
            toggleQR();
        }
    );

    active=true;
}

</script>

</body>
</html>
