<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenBudget Smart City</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

/* HEADER */
.header{
    padding:18px;
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
}
.header h2{margin:0;font-size:20px;}
.header p{margin:5px 0 0;opacity:0.8;font-size:13px;}

/* CARD */
.card{
    max-width:500px;
    margin:12px auto;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    padding:12px;
    border-radius:14px;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:15px;
    cursor:pointer;
}

/* RESULT CARD */
.result{
    margin-top:10px;
    padding:10px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
}

/* MAP */
#map{
    height:280px;
    border-radius:12px;
}

/* SCANNER */
#scanner{
    display:none;
    margin-top:10px;
}

/* LIST */
.item{
    padding:10px;
    margin-top:8px;
    background:rgba(255,255,255,0.05);
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
    <h2>🏛️ OpenBudget</h2>
    <p>Smart QR + Карта громади</p>
</div>

<!-- 📷 SCANNER -->
<div class="card">
    <button onclick="startScanner()">📷 Сканувати QR</button>
    <div id="scanner"></div>
</div>

<!-- 📊 RESULT -->
<div class="card">
    <div class="result" id="result">
        Наведіть QR або виберіть об’єкт
    </div>
</div>

<!-- 🗺️ MAP -->
<div class="card">
    <div id="map"></div>
</div>

<!-- 📍 LIST -->
<div class="card">
    <h3>📍 Об’єкти міста</h3>
    <div id="list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// 🧠 ДАНІ (місто — всі точки на карті)
const data = {
    bench_01:{
        title:"🪑 Лавка",
        price:9000,
        coords:[48.4647,35.0462],
        info:"Благоустрій міста"
    },
    trash_01:{
        title:"🗑️ Смітник",
        price:5400,
        coords:[48.4655,35.0500],
        info:"Комунальна інфраструктура"
    },
    stop_01:{
        title:"🚌 Зупинка",
        price:85000,
        coords:[48.4630,35.0440],
        info:"Транспортна інфраструктура"
    },
    stop_02:{
        title:"🚌 Зупинка центр",
        price:90000,
        coords:[48.4660,35.0480],
        info:"Центральна зупинка"
    }
};

// 📍 RESULT
function show(id){
    let o=data[id];
    if(!o) return;

    document.getElementById("result").innerHTML=`
        <b>${o.title}</b><br>
        💰 ${o.price.toLocaleString()} грн<br>
        📍 ${o.info}
    `;
}

// 🗺️ MAP (центр міста)
let map = L.map('map').setView([48.4647,35.0462], 14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:''
}).addTo(map);

// 📍 MARKERS
for(let id in data){
    let m=data[id];
    let marker=L.marker(m.coords).addTo(map);
    marker.bindPopup(m.title);
    marker.on("click",()=>show(id));
}

// 📍 LIST
let list=document.getElementById("list");

for(let id in data){
    let div=document.createElement("div");
    div.className="item";
    div.innerText=data[id].title;
    div.onclick=()=>show(id);
    list.appendChild(div);
}

// 📷 QR SCANNER (BUTTON CONTROL)
let scanner;

function startScanner(){
    let box=document.getElementById("scanner");

    if(scanner){
        scanner.clear();
        scanner=null;
        box.style.display="none";
        return;
    }

    box.style.display="block";

    scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (text)=>{
            show(text);
            scanner.stop();
            box.style.display="none";
        }
    );
}

</script>

</body>
</html>
